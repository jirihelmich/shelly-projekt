# Fyzické vypínače a tlačítka
# ABB Tango s pružinkami = monostabilní tlačítka.
# Každé tlačítko posílá eventy (short/long/double), ne stavy.

switches:
  - id: SW-A
    room: Obývák
    position: Vstup, první modul v P-OB (jednovypínač)
    hardware: Jednovypínač
    buttons:
      - button: A
        circuit: L-01  # schodiště
        wired_to: SH-01 SW1  # paralelka přes stáv. schodišťák Obývák↔H. předsíň
        mode: parallel
        parallel_with: SW-H1  # SW-H1 je teď attached lokálně v krabici u schodů

  - id: SW-B
    room: Obývák
    position: Vstup, druhý dvojvypínač (druhý modul v P-OB)
    hardware: Dvojvypínač pružinový — typ DVOUCESTNÝ (3 svorky / přepínačový mechanismus)
    buttons:
      - button: B1
        circuit: L-09  # předsíň strop HUE (sdíleno s SW-F2, SW-G2 paralelka na stejný vstup)
        wired_to: SH-07 IN2
        mode: detached
        parallel_with: [SW-F2, SW-G2]
      - button: B2
        circuit: L-10  # obývák strop HUE
        wired_to: SH-07 IN3
        mode: detached

  - id: SW-C
    room: Obývák
    position: Vstup, třetí dvojvypínač
    hardware: Dvojvypínač #3
    buttons:
      - button: C1
        circuit: L-05  # Lišta 1
        wired_to: SH-05 SW1
        mode: attached
      - button: C2
        circuit: L-06  # Lišta 2
        wired_to: SH-05 SW2
        mode: attached

  - id: SW-D
    room: Obývák
    position: Vstup, čtvrtý dvojvypínač (poslední modul v P-OB)
    hardware: Dvojvypínač pružinový — typ DVOUCESTNÝ (3 svorky / přepínačový mechanismus)
    buttons:
      - button: D1
        circuit: L-07  # Lišta 3
        wired_to: SH-06 SW1
        mode: attached
        parallel_with: SW-KU-L3
      - button: D2
        circuit: L-04  # Lustr jídelna (v nákresu "Lustr K" je nedorozumění)
        wired_to: SH-06 SW2
        mode: detached  # event → HA → Hue toggle; paralelně s SW-J2 přes stáv. schodišťák
        parallel_with: SW-J2

  - id: SW-E
    room: Obývák
    hardware: stávající
    buttons:
      - button: E
        circuit: L-12  # LED strop
        wired_to: SH-E1
        status: existing

  - id: SW-F1
    room: Dolní předsíň
    position: U pracovny (horní tlačítko v rámečku)
    hardware: Jednovypínač (vedle SW-F2)
    buttons:
      - button: F1
        circuit: L-09  # předsíň strop HUE
        wired_to: SH-07 IN2  # paralelka přes stáv. schodišťák Obývák↔Dolní předsíň
        mode: parallel
        parallel_with: SW-B1  # oba event-based, sbíhají se na SH-07 IN2

  - id: SW-F2
    room: Dolní předsíň
    position: U pracovny (dolní tlačítko v rámečku)
    hardware: Jednovypínač (vedle SW-F1)
    buttons:
      - button: F2
        circuit: L-02  # LED pásek
        wired_to: SH-02 SW1  # signálový vodič
        mode: attached
        parallel_with: SW-G2

  - id: SW-G
    room: Dolní předsíň
    position: U dveří
    hardware: Dvojvypínač pružinový — typ DVOUCESTNÝ (3 svorky / přepínačový mechanismus)
    shelly_in_box: NONE  # žádná Shelly v této krabici
    buttons:
      - button: G1
        circuit: L-09  # předsíň strop HUE (levá buňka)
        wired_to: SH-07 IN2  # paralelka přes stáv. schodišťák — stejný vstup jako SW-B1 a SW-F1
        mode: parallel
      - button: G2
        circuit: L-02  # LED pásek (pravá buňka)
        wired_to: SH-02 SW1  # přes stávající schodišťákový drát, paralelně s SW-F2
        mode: parallel
    notes: Krabice bez Shelly — jen WAGO svorky pro propojení tlačítek se stávajícími schodišťákovými dráty.

  - id: SW-H1
    room: Horní předsíň
    position: U schodů
    hardware: Jednovypínač (vedle SW-H2)
    buttons:
      - button: H1
        circuit: L-01  # schodiště
        wired_to: SH-01 SW1  # attached lokálně — SH-01 Mini je v této krabici
        mode: attached
        parallel_with: SW-A  # SW-A v obýváku je paralelka přes stáv. schodišťák
    notes: Krabice obsahuje SH-01 Mini (L-01 schodiště). Vedle ve stejném rámečku je SW-H2 v jiné krabici / na jiném okruhu (L-03).

  - id: SW-H2
    room: Horní předsíň
    position: U schodů
    hardware: Jednovypínač (vedle SW-H1)
    buttons:
      - button: H2
        circuit: L-03  # lustr horní předsíň
        wired_to: SH-03 SW1  # paralelka k SW-CP přes stáv. schodišťák H. předsíň (u schodů) ↔ P-CP
        mode: parallel
        parallel_with: SW-CP
    notes: Krabice za SW-H2 je BEZ Shelly — L-03 je na jiném okruhu, jehož L+N je v P-CP. Jen tlačítko + WAGO + signální vodič přes stáv. schodišťák do SH-03 v P-CP.

  - id: SW-CP
    room: Horní předsíň
    position: U pokoje (samostatný vypínač v horní předsíni, rámeček P-CP)
    hardware: Jednovypínač
    buttons:
      - button: CP
        circuit: L-03  # lustr horní předsíň
        wired_to: SH-03 SW1  # attached lokálně — SH-03 Mini je v této krabici
        mode: attached
        parallel_with: SW-H2
    notes: Krabice obsahuje SH-03 Mini (L-03 lustr H. předsíň). L+N pochází z lokálního okruhu v P-CP.

  - id: SW-J1
    room: Jídelna
    position: V 1 rámečku se SW-J2 (BEFORE — stávající stav)
    hardware: Jednovypínač
    deprecated_by: SW-J  # plánováno sjednotit do SW-J dvojvypínače
    buttons:
      - button: J1
        circuit: L-13  # LED jídelna (stávající)
        wired_to: SH-E2 SW
        status: existing

  - id: SW-J2
    room: Jídelna
    position: V 1 rámečku se SW-J1 (BEFORE — stávající stav)
    hardware: Jednovypínač
    deprecated_by: SW-J  # plánováno sjednotit do SW-J dvojvypínače
    buttons:
      - button: J2
        circuit: L-04  # lustr jídelna (HUE)
        wired_to: SH-06 SW2  # paralelka k SW-D2 přes stáv. schodišťákový drát do SH-06 (v obýváku)
        mode: parallel

  - id: SW-J
    room: Jídelna
    position: AFTER — nový dvojvypínač sjednocující SW-J1+SW-J2 (vedle nové zásuvky vlevo)
    hardware: Dvojvypínač pružinový (220V — krabice napojená na zásuvkový okruh)
    buttons:
      - button: J-LUSTR
        circuit: L-04  # lustr jídelna (HUE) — levá buňka
        wired_to: SH-06 SW2  # paralelka k SW-D2 přes stáv. schodišťákový drát do SH-06 (v obýváku)
        mode: parallel
      - button: J-LED
        circuit: L-13  # LED jídelna (24V, stávající SH-E2) — pravá buňka
        wired_to: SH-E2 SW (přes relé 220→24V)
        mode: attached  # tlačítko 220V → relé převede na 24V signál pro SH-E2
        notes: Předsazené relé 220→24V (analogie k LED digestoři v kuchyni). Stávající SH-E2 RGBW PM beze změny.
    notes: >
      Pořadí v rámečku zleva doprava: zásuvka, Lustr (HUE paralelka), LED (přes relé do SH-E2).
      Krabice je napojena na zásuvkový okruh (220V s N+PE), což umožňuje napájet 220V tlačítka
      a relé. Pravé tlačítko (LED) → relé 220→24V → vstup stávajícího SH-E2 24V (analogie kuchyně).
      Levé tlačítko (Lustr) je paralelka pro Hue přes stáv. schodišťák.

  # ============ KUCHYŇ (stávající rámeček, doplněno kvůli sdíleným okruhům) ============

  - id: SW-KU-L3
    room: Kuchyň
    position: Stávající rámeček
    hardware: Jednovypínač (stávající)
    buttons:
      - button: KU-L3
        circuit: L-07  # Lišta 3 (sdíleno s obývákem)
        wired_to: SH-06 SW1  # paralelka k SW-D1 přes stáv. schodišťákový drát
        mode: parallel
    notes: Paralelka k SW-D1 v obýváku pro Lišta 3. Ověřit drát Obývák→Kuchyň.

  - id: SW-KU-LEDAB
    room: Kuchyň
    position: Stávající rámeček
    hardware: Dvojvypínač (stávající)
    buttons:
      - button: KU-LEDA
        circuit: L-14  # LED kuchyň A (24V)
        wired_to: SH-E3 (stávající ovládání)
        status: existing
      - button: KU-LEDB
        circuit: L-15  # LED kuchyň B (24V)
        wired_to: SH-E3 (stávající ovládání)
        status: existing
    notes: Stávající zapojení kuchyňských 24V LED, beze změny.

  - id: SW-KU-DIG
    room: Kuchyň
    position: Stávající rámeček
    hardware: Jednovypínač (stávající)
    buttons:
      - button: KU-DIG
        circuit: L-16  # LED digestoř
        wired_to: SH-E3 (stávající ovládání)
        status: existing
    notes: Stávající ovládání LED digestoře, beze změny.

  # ============ PRACOVNA (2× dvojvypínač u dveří; 4 Lišty bez paralelek) ============

  - id: SW-PR-D1
    room: Pracovna
    position: U dveří, první dvojvypínač
    hardware: Dvojvypínač #1
    buttons:
      - button: PR-D1-1
        circuit: L-30  # Lišta pracovna 1
        wired_to: SH-14 SW1
        mode: attached
      - button: PR-D1-2
        circuit: L-31  # Lišta pracovna 2
        wired_to: SH-14 SW2
        mode: attached

  - id: SW-PR-D2
    room: Pracovna
    position: U dveří, druhý dvojvypínač (vedle SW-PR-D1)
    hardware: Dvojvypínač #2
    buttons:
      - button: PR-D2-1
        circuit: L-32  # Lišta pracovna 3
        wired_to: SH-15 SW1
        mode: attached
      - button: PR-D2-2
        circuit: L-33  # Lišta pracovna 4
        wired_to: SH-15 SW2
        mode: attached

  - id: SW-PR-V
    room: Pracovna
    position: U pracovního stolu (venkovní svítidlo)
    hardware: Jednovypínač (stávající)
    status: existing
    ignored: true
    buttons:
      - button: PR-V
        circuit: L-40  # venkovní svítidlo, stávající 230V non-HUE
        wired_to: stávající zapojení
        status: existing
    notes: >
      Stávající vypínač venkovního svítidla u pracovního stolu. Mimo scope —
      beze změny, žádná Shelly, dokumentováno jen pro úplnost.

  # ============ KOUPELNA HORNÍ (1× dvojvypínač + samostatný vypínač zrcadla) ============

  - id: SW-KH-D
    room: Koupelna horní
    position: U dveří
    hardware: Dvojvypínač
    buttons:
      - button: KH-D-1
        circuit: L-34  # LED trafo 220V
        wired_to: SH-16 SW1
        mode: attached
      - button: KH-D-2
        circuit: L-35  # Strop HUE
        wired_to: SH-16 SW2
        mode: detached  # event → HA → Hue toggle

  - id: SW-KH-ZRC
    room: Koupelna horní
    position: U zrcadla
    hardware: Jednovypínač (stávající)
    status: existing
    ignored: true
    buttons:
      - button: KH-ZRC
        circuit: L-41  # zrcadlové svítidlo, stávající 230V non-HUE
        wired_to: stávající zapojení
        status: existing
    notes: >
      Stávající vypínač zrcadlového svítidla. Beze změny, žádná Shelly.

  # ============ WC (1 dvojvypínač u dveří) ============

  - id: SW-WC-D
    room: WC
    position: U dveří
    hardware: Dvojvypínač
    buttons:
      - button: WC-D-1
        circuit: L-36  # LED + ventilátor (společně)
        wired_to: SH-17 SW1
        mode: attached
      - button: WC-D-2
        circuit: L-37  # Strop HUE
        wired_to: SH-17 SW2
        mode: detached  # event → HA → Hue toggle

  # ============ IGNORED (stávající, dokumentováno, beze změny) ============

  - id: SW-GA
    room: Garáž
    position: U dveří
    hardware: Jednovypínač (stávající)
    status: existing
    ignored: true
    buttons:
      - button: GA
        circuit: L-42  # stropní 230V non-HUE
        wired_to: stávající zapojení
        status: existing
    notes: Světlo v garáži. Beze změny, žádná Shelly.

  - id: SW-KD-1
    room: Koupelna dolní
    position: U dveří, první dvojvypínač
    hardware: Dvojvypínač (stávající)
    status: existing
    ignored: true
    buttons:
      - button: KD-1-1
        circuit: L-43  # ventilátor
        wired_to: stávající zapojení
        status: existing
      - button: KD-1-2
        circuit: L-44  # umyvadlo
        wired_to: stávající zapojení
        status: existing
    notes: Ovládá ventilátor + svítidlo u umyvadla. Beze změny, žádná Shelly.

  - id: SW-KD-2
    room: Koupelna dolní
    position: U dveří, druhý dvojvypínač (vedle SW-KD-1)
    hardware: Dvojvypínač (stávající)
    status: existing
    ignored: true
    buttons:
      - button: KD-2-1
        circuit: L-45  # stropní
        wired_to: stávající zapojení
        status: existing
      - button: KD-2-2
        circuit: L-46  # závěs (pendant)
        wired_to: stávající zapojení
        status: existing
    notes: Ovládá strop + závěsné svítidlo. Beze změny, žádná Shelly.

  - id: SW-PH
    room: Pokoj hostů
    hardware: Jednovypínač (stávající)
    status: existing
    ignored: true
    buttons:
      - button: PH
        circuit: L-47  # stropní 230V non-HUE
        wired_to: stávající zapojení
        status: existing
    notes: Světlo v pokoji pro hosty. Beze změny, žádná Shelly.

  - id: SW-PP
    room: Prázdný pokoj
    hardware: Jednovypínač (stávající)
    status: existing
    ignored: true
    buttons:
      - button: PP
        circuit: L-48  # stropní 230V non-HUE
        wired_to: stávající zapojení
        status: existing
    notes: Světlo v prázdném pokoji. Beze změny, žádná Shelly.

  # ============ LOŽNICE (bokem — samostatný diagram) ============

  - id: SW-LZ-ZRC
    room: Ložnice
    position: U zrcadla
    scope: loznice
    hardware: Jednovypínač (s i4 pod ním)
    buttons:
      - button: ZRC
        circuit: L-20  # (+ L-21 toggle spolu skupinově)
        wired_to: SH-11 IN1
        mode: detached
    notes: Tlačítko toggluje skupinu (Zrcadlo A + B) přes HA automatizaci.

  - id: SW-LZ-D
    room: Ložnice
    position: U dveří
    scope: loznice
    hardware: Dvojvypínač (s i4 pod ním)
    buttons:
      - button: D1
        circuit: L-22  # (+ L-23 toggle spolu skupinově)
        wired_to: SH-12 IN1
        mode: detached
      - button: D2
        circuit: L-24  # lustr 9× Vintage
        wired_to: SH-12 IN2
        mode: detached
    notes: D1 toggluje skupinu Za+Pod postelí; D2 toggluje Vintage skupinu v lustru.

# ============ SOUHRN KRABIC ============

boxes_summary:
  with_shelly:
    - {location: "Obývák vstup (SW-B/C/D) — konzole", devices: [SH-05, SH-06, SH-07]}
    - {location: "Dolní předsíň, pracovna (SW-F1)", devices: [SH-02]}
    - {location: "Horní předsíň, u schodů (SW-H1) — krabice na okruhu L-01", devices: [SH-01]}
    - {location: "Horní předsíň, u pokoje (SW-CP, P-CP) — krabice na okruhu L-03", devices: [SH-03]}
    - {location: "Pracovna, u dveří (SW-PR-D1 + SW-PR-D2)", devices: [SH-14, SH-15]}
    - {location: "Koupelna horní, u dveří (SW-KH-D)", devices: [SH-16]}
    - {location: "WC, u dveří (SW-WC-D)", devices: [SH-17]}

  without_shelly:
    - {location: "Obývák, krabice za SW-A", reason: "SW-A je paralelka přes stáv. schodišťák Obývák↔H. předsíň → SH-01 SW1 v krabici u schodů. Jen tlačítko + WAGO."}
    - {location: "Dolní předsíň, u pracovny (SW-F2)", reason: "Paralelka k SW-B1 (obývák) přes stáv. schodišťák → SH-07 IN2"}
    - {location: "Dolní předsíň, u dveří (SW-G)", reason: "G1 paralelka do SH-02 SW1 (pracovna); G2 paralelka do SH-07 IN2 (obývák) přes schodišťáky"}
    - {location: "Horní předsíň, u schodů (SW-H2) — okruh L-03 nemá v této krabici N", reason: "Paralelka k SW-CP přes stáv. schodišťák H. předsíň↔P-CP → SH-03 SW1 v P-CP. Jen tlačítko + WAGO."}
    - {location: "Jídelna (SW-J1 + SW-J2)", reason: "SW-J1 na stáv. SH-E2; SW-J2 paralelka k SW-D2 přes stáv. schodišťákový drát do SH-06 SW2 v obýváku"}
